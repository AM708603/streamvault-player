<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="origin">
<title>StreamVault Player</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--card:#16161a;--hover:#1c1c21;--border:rgba(255,255,255,.08);--text:#f4f4f5;--muted:#71717a;--accent:#e50914}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:#050505;border-bottom:1px solid var(--border)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.04em;color:var(--accent);text-decoration:none}
.logo span{color:#fff}
.back{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:#ddd;text-decoration:none;padding:8px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05)}
.back:hover{background:rgba(255,255,255,.12)}
.wrap{max-width:1280px;margin:0 auto}
.video{position:relative;width:100%;aspect-ratio:16/9;max-height:78vh;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.msg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);padding:20px;text-align:center}
.info{padding:18px 18px 8px}
h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:.03em;line-height:1}
.sub{font-size:.78rem;color:var(--muted);margin-top:6px}
.nav{display:flex;gap:10px;margin-top:14px}
.nbtn{padding:10px 18px;border-radius:6px;font-size:.8rem;font-weight:600;background:var(--card);border:1px solid var(--border)}
.nbtn:hover:not(:disabled){background:var(--hover)}
.nbtn.red{background:var(--accent);border-color:var(--accent)}
.nbtn:disabled{opacity:.35;cursor:not-allowed}
.eps{padding:10px 18px 60px}
.eps h2{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:.08em;color:#a1a1aa;margin:14px 0 10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:6px 14px;border-radius:20px;font-size:.7rem;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--muted)}
.tab.on{border-color:var(--accent);color:var(--accent);background:rgba(229,9,20,.14)}
.list{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto}
.ep{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--border);cursor:pointer}
.ep:hover{background:var(--hover)}
.ep.on{border-color:var(--accent);background:rgba(229,9,20,.14)}
.ep .n{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#3a3a40;min-width:30px;text-align:center}
.ep.on .n{color:var(--accent)}
.ep .nm{font-size:.82rem;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

<div class="top">
  <a class="logo" id="logo" href="#">Stream<span>Vault</span></a>
  <a class="back" id="backBtn" href="#">&#8249; Back to site</a>
</div>

<div class="wrap">
  <div class="video" id="video"><div class="msg">Loading player…</div></div>
  <div class="info">
    <h1 id="title">Now Playing</h1>
    <div class="sub" id="sub"></div>
    <div class="nav" id="nav" style="display:none">
      <button class="nbtn" id="prevBtn">&#8249; Previous</button>
      <button class="nbtn red" id="nextBtn">Next &#8250;</button>
    </div>
  </div>
  <div class="eps" id="epsBox" style="display:none">
    <h2>Episodes</h2>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
// ══════════ CONFIG — edit these two lines if your URLs change ══════════
var SITE = 'https://streamzvault.netlify.app';                       // your main website
var API  = 'https://streamvault.amworkmanage.workers.dev';            // your Cloudflare Worker
// ════════════════════════════════════════════════════════════════════
var VS   = 'https://vidstuck.cc/embed';
var OPTS = 'color=E50914&branding=StreamVault&subtitle=english';

var P = new URLSearchParams(location.search);
var type  = P.get('type') === 'tv' ? 'tv' : 'movie';
var id    = parseInt(P.get('id'), 10);
var s     = parseInt(P.get('s'), 10) || 1;
var e     = parseInt(P.get('e'), 10) || 1;
var title = (P.get('title') || '').slice(0, 200);
var back  = safeBack(P.get('back'));
var EPS = [], viewS = s;

function $(i){ return document.getElementById(i); }
function mk(tag, cls, txt){ var n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }

// only allow going back to YOUR site (prevents open-redirect abuse)
function safeBack(u){
  try { var x = new URL(u); if (x.origin === SITE) return x.href; } catch (_) {}
  return SITE + '/';
}

$('logo').href = SITE + '/';
$('backBtn').href = back;

function src(){
  if (type === 'movie') return VS + '/movie/' + id + '?' + OPTS;
  return VS + '/tv/' + id + '/' + s + '/' + e + '?' + OPTS +
         '&nextEpisode=true&episodeSelector=true&autoplayNextEpisode=true';
}

function load(){
  var box = $('video');
  box.innerHTML = '';
  var f = document.createElement('iframe');
  f.src = src();
  f.allowFullscreen = true;
  f.setAttribute('allow', 'encrypted-media; autoplay; fullscreen');
  box.appendChild(f);
  var label = type === 'tv' ? ' · S' + s + 'E' + e : '';
  $('title').textContent = (title || 'Now Playing');
  $('sub').textContent = type === 'tv' ? 'Season ' + s + ' · Episode ' + e : 'Movie';
  document.title = (title || 'Player') + label + ' — StreamVault';
}

function urlFor(){
  P.set('s', s); P.set('e', e);
  return location.pathname + '?' + P.toString();
}

function idx(){ return EPS.findIndex(function(x){ return x.s === s && x.e === e; }); }

function updateNav(){
  var i = idx();
  $('prevBtn').disabled = i <= 0;
  $('nextBtn').disabled = i < 0 || i >= EPS.length - 1;
}

function go(ns, ne){
  s = ns; e = ne; viewS = ns;
  load(); renderEps(); updateNav();
  try { history.replaceState(null, '', urlFor()); } catch (_) {}
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderEps(){
  var seasons = [];
  EPS.forEach(function(x){ if (seasons.indexOf(x.s) === -1) seasons.push(x.s); });
  var tabs = $('tabs'); tabs.innerHTML = '';
  if (seasons.length > 1) seasons.forEach(function(n){
    var b = mk('button', 'tab' + (n === viewS ? ' on' : ''), 'Season ' + n);
    b.onclick = function(){ viewS = n; renderEps(); };
    tabs.appendChild(b);
  });
  var list = $('list'); list.innerHTML = '';
  EPS.filter(function(x){ return x.s === viewS; }).forEach(function(x){
    var row = mk('div', 'ep' + (x.s === s && x.e === e ? ' on' : ''));
    row.appendChild(mk('span', 'n', x.e));
    row.appendChild(mk('span', 'nm', x.name));
    row.onclick = function(){ go(x.s, x.e); };
    list.appendChild(row);
  });
}

$('prevBtn').onclick = function(){ var i = idx(); if (i > 0) go(EPS[i-1].s, EPS[i-1].e); };
$('nextBtn').onclick = function(){ var i = idx(); if (i >= 0 && i < EPS.length - 1) go(EPS[i+1].s, EPS[i+1].e); };

// load title info + episode list from your Worker (optional — player still works if this fails)
function loadMeta(){
  fetch(API + '/api/content', { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      var pool = (d.movies || []).concat(d.tvshows || []).concat(d.anime || []);
      var item = pool.find(function(x){ return Number(x.id) === id; });
      if (!item) return;
      if (!title) { title = item.title || ''; load(); }
      if (type !== 'tv') return;
      if (item.seasons && item.seasons.length) {
        item.seasons.forEach(function(ss){
          (ss.episodes || []).forEach(function(ep){
            EPS.push({ s: ss.s || 1, e: ep.e, name: ep.n || ep.name || ('Episode ' + ep.e) });
          });
        });
      } else if (item.episodes && item.episodes.length) {
        item.episodes.forEach(function(ep){
          EPS.push({ s: 1, e: ep.e, name: ep.n || ep.name || ('Episode ' + ep.e) });
        });
      }
      if (EPS.length) {
        $('epsBox').style.display = '';
        $('nav').style.display = '';
        renderEps(); updateNav();
      }
    })
    .catch(function(){});
}

if (!id) {
  $('video').innerHTML = '<div class="msg">Invalid link. Please go back to the site and press Play again.</div>';
} else {
  load();
  loadMeta();
}
</script>
</body>
</html>
